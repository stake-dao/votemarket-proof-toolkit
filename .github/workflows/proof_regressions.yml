name: Proof Regressions

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    paths:
      - "votemarket_toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/proof_regressions.yml"
  push:
    paths:
      - "votemarket_toolkit/**"
      - "scripts/**"
      - "tests/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/proof_regressions.yml"

jobs:
  proof-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - name: Check out proof toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked Python dependencies
        run: |
          uv python install 3.12
          uv sync --locked --extra dev

      # These recorded-proof regressions need neither RPC nor private sources.
      # The Curve Solidity E2E check runs in the private contracts repository.
      - name: Test proof generation and batch artifacts
        run: |
          uv run --locked --extra dev pytest -q \
            tests/unit/test_curve_protocol.py \
            tests/unit/test_bulk_proofs.py \
            tests/unit/test_bulk_node_stacks.py \
            tests/unit/test_bulk_response_validation.py \
            tests/unit/test_node_bag.py \
            tests/unit/test_batch_artifacts.py
